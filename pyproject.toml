[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trading"
version = "0.1.0"
description = "AI Multi-Agent Trading System"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "httpcore>=1.0.9",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=1.0.0,<2.0",
    "ruff==0.16.0",
]
test = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=1.0.0,<2.0",
    "ruff==0.16.0",
]

[project.scripts]
agent-trading = "agent_trading.main:main"
run-orchestrator-once = "scripts.run_orchestrator_once:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
testpaths = ["tests"]
markers = [
    "smoke: KIS paper/sandbox read-only smoke test (requires KIS API credentials)",
    "slow: Time-intensive tests (WebSocket, etc.)",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_trading*"]

name: Harness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_main:
        description: "Deploy latest origin/main after safe harness"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      allow_market_hours_deploy:
        description: "Reserved for market-hours deploy override"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_heavy:
        description: "Run HARNESS_ALLOW_HEAVY gated checks"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Deployment change detector
    runs-on: ubuntu-latest
    outputs:
      deploy_required: ${{ steps.detect.outputs.deploy_required }}
      activate_required: ${{ steps.detect.outputs.activate_required }}
      changed_file_count: ${{ steps.detect.outputs.changed_file_count }}
      deploy_relevant_file_count: ${{ steps.detect.outputs.deploy_relevant_file_count }}
      sync_only_candidate_count: ${{ steps.detect.outputs.sync_only_candidate_count }}
      sync_only_allowlist_count: ${{ steps.detect.outputs.sync_only_allowlist_count }}
      sync_only_blocked_count: ${{ steps.detect.outputs.sync_only_blocked_count }}
      deploy_manual_dispatch_requested_count: ${{ steps.detect.outputs.deploy_manual_dispatch_requested_count }}
      frontend_only_activate: ${{ steps.detect.outputs.frontend_only_activate }}
      non_frontend_runtime_file_count: ${{ steps.detect.outputs.non_frontend_runtime_file_count }}
      runtime_affecting_pattern: ${{ steps.detect.outputs.runtime_affecting_pattern }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect deploy-relevant changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # runtime 영향 경로 규칙의 단일 정의. sync_source가 서버의 대기 변경을
          # 판정할 때도 이 값을 output으로 받아 쓰므로 양쪽 분기 이전에 정의한다.
          runtime_affecting_pattern='^(\.python-version|\.postgres-version|Dockerfile|docker-compose\.yml|pyproject\.toml|requirements(\.lock|\.txt)?|db/|src/|scripts/[^/]+\.(py|sh)|admin_ui/(Dockerfile|nginx\.frontend\.conf|package(-lock)?\.json|tsconfig[^/]*\.json|vite\.config\.[^/]+|src/|public/))'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            deploy_manual_dispatch_requested_count="0"
            if [ "${{ inputs.deploy_main }}" = "true" ]; then
              deploy_manual_dispatch_requested_count="1"
            fi

            {
              echo "deploy_required=0"
              echo "activate_required=0"
              echo "changed_file_count=0"
              echo "deploy_relevant_file_count=0"
              echo "sync_only_candidate_count=0"
              echo "sync_only_allowlist_count=0"
              echo "sync_only_blocked_count=0"
              echo "deploy_manual_dispatch_requested_count=$deploy_manual_dispatch_requested_count"
              echo "frontend_only_activate=0"
              echo "non_frontend_runtime_file_count=0"
              echo "runtime_affecting_pattern=$runtime_affecting_pattern"
            } >> "$GITHUB_OUTPUT"

            echo "changed_file_count=0"
            echo "deploy_relevant_file_count=0"
            echo "deploy_required=0"
            echo "activate_required=0"
            echo "sync_only_candidate_count=0"
            echo "sync_only_allowlist_count=0"
            echo "sync_only_blocked_count=0"
            echo "deploy_skipped_by_docs_only_count=0"
            echo "deploy_manual_dispatch_requested_count=$deploy_manual_dispatch_requested_count"
            echo "frontend_only_activate_count=0"
            echo "non_frontend_runtime_file_count=0"
            exit 0
          fi

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            base_ref="${{ github.event.before }}"
          fi

          changed_files="$(git diff --name-only "$base_ref" HEAD || true)"
          changed_file_count="$(printf '%s\n' "$changed_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          sync_only_allowlist_pattern='^(docs/.+|scripts/harness/.+|\.github/workflows/.+|scripts/(analyze_trigger_proxy_attribution\.py|check_index_membership_staleness\.py|check_t3_db_status\.py|diagnose_activity_filter_half_period_divergence\.py|diagnose_blocked_reason_distribution\.py|diagnose_market_overlay_shadow\.py|observe_seeded_news_comparison\.py))$'
          sync_only_candidates="$(
            printf '%s\n' "$changed_files" |
              sed '/^$/d' |
              grep -E '^(docs/.+|scripts/harness/.+|\.github/workflows/.+|scripts/[^/]+\.(py|sh))$' || true
          )"
          sync_only_allowlist_files="$(
            printf '%s\n' "$sync_only_candidates" |
              sed '/^$/d' |
              grep -E "$sync_only_allowlist_pattern" || true
          )"
          # sync-only 허용 목록(문서, 하네스, 워크플로, 지정 분석 스크립트)은 서버
          # 런타임이 읽지 않으므로 재기동 대상에서 뺀다. 이 제외가 없으면
          # scripts/ 규칙이 sync-only 경로를 통째로 없앤다.
          runtime_affecting_files="$(
            printf '%s\n' "$changed_files" |
              sed '/^$/d' |
              grep -E "$runtime_affecting_pattern" |
              grep -vE "$sync_only_allowlist_pattern" || true
          )"
          # sync-only 허용 목록은 배포 게이트에서도 제외한다. 여기에 남아 있으면
          # deploy_required=1이 되어 market_hours_guard가 실행되고, 그 결과
          # sync_source의 sync-only 분기(guard skipped 전제)가 장중에 성립하지 않는다.
          deploy_relevant_files="$(
            printf '%s\n' "$changed_files" |
              sed '/^$/d' |
              grep -vE "$sync_only_allowlist_pattern" |
              grep -E '^(\.python-version|\.postgres-version|Dockerfile|docker-compose\.yml|pyproject\.toml|requirements(\.lock|\.txt)?|db/|src/|scripts/[^/]+\.(py|sh)|admin_ui/(Dockerfile|nginx\.frontend\.conf|package(-lock)?\.json|tsconfig[^/]*\.json|vite\.config\.[^/]+|src/|public/))' || true
          )"
          sync_only_candidate_count="$(printf '%s\n' "$sync_only_candidates" | sed '/^$/d' | wc -l | tr -d ' ')"
          sync_only_allowlist_count="$(printf '%s\n' "$sync_only_allowlist_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          sync_only_blocked_count="$((sync_only_candidate_count - sync_only_allowlist_count))"
          deploy_relevant_file_count="$(printf '%s\n' "$deploy_relevant_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          activate_relevant_file_count="$(printf '%s\n' "$runtime_affecting_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          # 런타임 영향 파일이 전부 admin_ui/ 아래면 프런트 전용 배포로 본다.
          # admin_ui/AGENTS.md 같은 비런타임 파일은 애초에 runtime_affecting_pattern에
          # 걸리지 않으므로 여기서 따로 걸러낼 필요가 없다.
          non_frontend_runtime_files="$(
            printf '%s\n' "$runtime_affecting_files" |
              sed '/^$/d' |
              grep -vE '^admin_ui/' || true
          )"
          non_frontend_runtime_file_count="$(printf '%s\n' "$non_frontend_runtime_files" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$deploy_relevant_file_count" -gt 0 ]; then
            deploy_required="1"
            deploy_skipped_by_docs_only_count="0"
          else
            deploy_required="0"
            deploy_skipped_by_docs_only_count="1"
          fi

          if [ "$activate_relevant_file_count" -gt 0 ]; then
            activate_required="1"
          else
            activate_required="0"
          fi

          if [ "$activate_required" = "1" ] && [ "$non_frontend_runtime_file_count" -eq 0 ]; then
            frontend_only_activate="1"
          else
            frontend_only_activate="0"
          fi

          {
            echo "deploy_required=$deploy_required"
            echo "activate_required=$activate_required"
            echo "changed_file_count=$changed_file_count"
            echo "deploy_relevant_file_count=$deploy_relevant_file_count"
            echo "sync_only_candidate_count=$sync_only_candidate_count"
            echo "sync_only_allowlist_count=$sync_only_allowlist_count"
            echo "sync_only_blocked_count=$sync_only_blocked_count"
            echo "deploy_manual_dispatch_requested_count=0"
            echo "frontend_only_activate=$frontend_only_activate"
            echo "non_frontend_runtime_file_count=$non_frontend_runtime_file_count"
            echo "runtime_affecting_pattern=$runtime_affecting_pattern"
          } >> "$GITHUB_OUTPUT"

          echo "changed_file_count=$changed_file_count"
          echo "deploy_relevant_file_count=$deploy_relevant_file_count"
          echo "deploy_required=$deploy_required"
          echo "activate_required=$activate_required"
          echo "sync_only_candidate_count=$sync_only_candidate_count"
          echo "sync_only_allowlist_count=$sync_only_allowlist_count"
          echo "sync_only_blocked_count=$sync_only_blocked_count"
          echo "deploy_skipped_by_docs_only_count=$deploy_skipped_by_docs_only_count"
          echo "deploy_manual_dispatch_requested_count=0"
          echo "frontend_only_activate_count=$frontend_only_activate"
          echo "non_frontend_runtime_file_count=$non_frontend_runtime_file_count"

  safe:
    name: Safe harness contracts
    runs-on: ubuntu-latest
    env:
      HARNESS_CI: "1"
      HARNESS_SAFE_TIMEOUT_SECONDS: "180"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: admin_ui/.nvmrc
          cache: npm
          cache-dependency-path: admin_ui/package-lock.json

      - name: Install backend dependencies
        run: python3 -m pip install --constraint requirements.lock -e ".[dev]"

      - name: Install Admin UI dependencies
        working-directory: admin_ui
        run: npm ci

      - name: Start pinned PostgreSQL container
        run: |
          POSTGRES_VERSION="$(cat .postgres-version)"
          docker run --detach --name trading_db \
            --env POSTGRES_USER=trading \
            --env POSTGRES_PASSWORD=trading \
            --env POSTGRES_DB=trading \
            "postgres:${POSTGRES_VERSION}"
          for attempt in {1..30}; do
            if docker exec trading_db pg_isready -U trading -d trading >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs trading_db
          exit 1

      - name: Run quick harness snapshot
        run: bash scripts/harness/run.sh check quick

      - name: Run architecture and style contracts
        run: |
          bash scripts/harness/run.sh accept db-structure
          bash scripts/harness/run.sh accept architecture
          bash scripts/harness/run.sh accept style
          bash scripts/harness/run.sh accept no-bypass

      - name: Run type-check contracts
        run: |
          bash scripts/harness/run.sh type-check backend
          bash scripts/harness/run.sh type-check frontend

      - name: Run read-only security snapshot
        run: bash scripts/harness/run.sh security scan

  heavy:
    name: Heavy harness contracts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_heavy == 'true'
    env:
      HARNESS_CI: "1"
      HARNESS_ALLOW_HEAVY: "1"
      HARNESS_HEAVY_TIMEOUT_SECONDS: "900"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: admin_ui/.nvmrc
          cache: npm
          cache-dependency-path: admin_ui/package-lock.json

      - name: Install backend dependencies
        run: python3 -m pip install --constraint requirements.lock -e ".[dev]"

      - name: Install Admin UI dependencies
        working-directory: admin_ui
        run: npm ci

      - name: Run heavy harness checks
        run: |
          bash scripts/harness/run.sh full-test
          bash scripts/harness/run.sh admin-build

  fdc_quota_postgres_relevant:
    name: FDC quota PostgreSQL relevance detector
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      # 가장 단순하고 안전한 방식(fetch-depth: 0)을 쓴다 — PR base
      # SHA가 얕은 checkout 때문에 로컬에 없어 비교 자체가 불가능해지는
      # 사고를 막는다(2026-08-25 2차 보정).
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect FDC quota PostgreSQL-relevant changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # Safe/Heavy job의 범위·timeout·실행 조건은 건드리지 않고,
          # 이 좁은 PostgreSQL 통합 job만 독립적으로 file-change 감지한다
          # (기존 `changes` job의 출력을 재사용하지 않음 — 그 job의 계약을
          # 변경할 위험을 피하기 위해 완전히 분리된 판정).
          #
          # 2026-08-25 2차 보정: 이전 버전은 `HEAD^`(마지막 커밋 1개)만
          # 봤다 — FDC quota 파일을 고친 커밋 뒤에 문서만 고친 커밋을
          # 추가로 push하면 마지막 커밋만 비교해 relevant=0으로 잘못
          # 판정하는 결함이 있었다. 이제 이벤트별로 PR/push **전체
          # 범위**를 비교 기준으로 쓴다:
          #   - pull_request: base 브랜치 SHA(github.event.pull_request.
          #     base.sha) .. HEAD
          #   - push: 직전 push 시점 SHA(github.event.before) .. HEAD
          #   - workflow_dispatch: 항상 relevant=1
          # 판정 로직 자체는 fixture git 저장소로 단위 테스트 가능한
          # 별도 스크립트(scripts/harness/detect_fdc_quota_postgres_
          # relevance.sh)로 분리했다 — 이 워크플로 스텝은 이벤트별
          # base_ref만 계산해 그 스크립트에 넘긴다.
          event_name="${{ github.event_name }}"
          case "$event_name" in
            pull_request)
              base_ref="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              base_ref="${{ github.event.before }}"
              ;;
            *)
              base_ref=""
              ;;
          esac

          bash scripts/harness/detect_fdc_quota_postgres_relevance.sh \
            "$event_name" "$base_ref" "HEAD" "." | tee /tmp/fdc_quota_relevance.log

          grep '^relevant=' /tmp/fdc_quota_relevance.log >> "$GITHUB_OUTPUT"

  fdc_quota_postgres_integration:
    name: FDC quota PostgreSQL integration tests
    runs-on: ubuntu-latest
    needs: [fdc_quota_postgres_relevant]
    if: needs.fdc_quota_postgres_relevant.outputs.relevant == '1'
    env:
      HARNESS_CI: "1"
      HARNESS_SAFE_TIMEOUT_SECONDS: "180"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # CI 전용 ephemeral PostgreSQL 컨테이너 접속 정보 — 운영 DB/컨테이너와
      # 무관하며, 이 job이 끝나면 컨테이너 자체가 폐기된다.
      DATABASE_HOST: "127.0.0.1"
      DATABASE_PORT: "5432"
      DATABASE_USER: "trading"
      DATABASE_PASSWORD: "trading"
      DATABASE_NAME: "trading"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install backend dependencies
        run: python3 -m pip install --constraint requirements.lock -e ".[dev]"

      - name: Start CI-only ephemeral PostgreSQL container
        run: |
          POSTGRES_VERSION="$(cat .postgres-version)"
          docker run --detach --name trading_db_fdc_quota_ci \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=trading \
            --env POSTGRES_PASSWORD=trading \
            --env POSTGRES_DB=trading \
            "postgres:${POSTGRES_VERSION}"
          for attempt in {1..30}; do
            if docker exec trading_db_fdc_quota_ci pg_isready -U trading -d trading >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs trading_db_fdc_quota_ci
          exit 1

      - name: Run FDC quota PostgreSQL integration tests (skip=0 required)
        run: |
          set -euo pipefail
          # migration은 이 CI 전용 컨테이너에만 적용된다 — DATABASE_HOST가
          # 127.0.0.1(방금 띄운 trading_db_fdc_quota_ci)을 가리키므로,
          # tests/services/test_fdc_quota_coordinator.py의 db_ready fixture가
          # create_pool()+run_all_migrations()로 0068_add_fdc_quota_lifecycle_
          # tables.sql을 포함한 전체 migration을 이 컨테이너에 적용한다.
          # 운영 DB/컨테이너는 이 job에서 전혀 참조하지 않는다.
          bash scripts/harness/run.sh test-file tests/services/test_fdc_quota_coordinator.py \
            2>&1 | tee /tmp/fdc_quota_pg_test.log

          skipped_line="$(grep -oE '[0-9]+ skipped' /tmp/fdc_quota_pg_test.log | tail -1 || true)"
          skipped_count="$(printf '%s' "$skipped_line" | grep -oE '^[0-9]+' || true)"
          skipped_count="${skipped_count:-0}"
          echo "postgres_skipped_count=$skipped_count"

          if [ "$skipped_count" != "0" ]; then
            echo "::error::PostgreSQL 통합 테스트가 ${skipped_count}건 skip됐습니다 — DATABASE_HOST 등 CI 전용 DB 환경이 제대로 전달되지 않았을 가능성이 있습니다. exit code만으로는 이 job을 통과시키지 않습니다."
            exit 1
          fi

      - name: Stop CI-only ephemeral PostgreSQL container
        if: always()
        run: docker rm -f trading_db_fdc_quota_ci >/dev/null 2>&1 || true

  postgres_fixture_loop_scope_relevant:
    name: PostgreSQL fixture loop-scope relevance detector
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect PostgreSQL fixture loop-scope-relevant changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # tests/conftest.py의 공용 postgres_repos/seeded_postgres_data
          # fixture와, 이를 소비하는 로컬 async fixture(예: test_postgres_
          # fill_events.py/test_postgres_broker_orders.py의 로컬
          # seeded_postgres_data override + 체이닝된 하위 fixture)의
          # event-loop scope 위험을 재현·검증하는 job이다(2026-08-26).
          # FDC quota 전용 job(fdc_quota_postgres_relevant/_integration)과
          # 역할을 분리하되, 이벤트별 base ref 계산·보수적 fallback 판정
          # 로직은 그대로 재사용한다 — detect_fdc_quota_postgres_relevance.sh
          # 의 5번째 인자(pattern override)로 이 job 전용 패턴만 넘긴다.
          event_name="${{ github.event_name }}"
          case "$event_name" in
            pull_request)
              base_ref="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              base_ref="${{ github.event.before }}"
              ;;
            *)
              base_ref=""
              ;;
          esac

          pattern='^(tests/conftest\.py|tests/repositories/test_postgres_fill_events\.py|tests/repositories/test_postgres_broker_orders\.py|tests/repositories/test_external_events\.py|src/agent_trading/db/(connection|transaction)\.py|\.github/workflows/harness\.yml|scripts/harness/detect_fdc_quota_postgres_relevance\.sh)$'

          bash scripts/harness/detect_fdc_quota_postgres_relevance.sh \
            "$event_name" "$base_ref" "HEAD" "." "$pattern" | tee /tmp/pg_fixture_relevance.log

          grep '^relevant=' /tmp/pg_fixture_relevance.log >> "$GITHUB_OUTPUT"

  postgres_fixture_loop_scope_integration:
    name: PostgreSQL fixture loop-scope integration tests
    runs-on: ubuntu-latest
    needs: [postgres_fixture_loop_scope_relevant]
    if: needs.postgres_fixture_loop_scope_relevant.outputs.relevant == '1'
    env:
      HARNESS_CI: "1"
      HARNESS_SAFE_TIMEOUT_SECONDS: "180"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # CI 전용 ephemeral PostgreSQL 컨테이너 접속 정보 — 운영 DB/컨테이너와
      # 무관하며, 이 job이 끝나면 컨테이너 자체가 폐기된다. FDC quota 전용
      # job과 컨테이너 이름을 다르게 써서 서로 겹치지 않는다(어차피 서로
      # 다른 러너에서 실행되지만 명확성을 위해 분리).
      DATABASE_HOST: "127.0.0.1"
      DATABASE_PORT: "5432"
      DATABASE_USER: "trading"
      DATABASE_PASSWORD: "trading"
      DATABASE_NAME: "trading"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install backend dependencies
        run: python3 -m pip install --constraint requirements.lock -e ".[dev]"

      - name: Start CI-only ephemeral PostgreSQL container
        run: |
          POSTGRES_VERSION="$(cat .postgres-version)"
          docker run --detach --name trading_db_pg_fixture_ci \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=trading \
            --env POSTGRES_PASSWORD=trading \
            --env POSTGRES_DB=trading \
            "postgres:${POSTGRES_VERSION}"
          for attempt in {1..30}; do
            if docker exec trading_db_pg_fixture_ci pg_isready -U trading -d trading >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs trading_db_pg_fixture_ci
          exit 1

      - name: Run PostgreSQL fixture loop-scope integration tests
        run: |
          set -uo pipefail
          # 대표 3개 파일:
          #   - tests/repositories/test_postgres_fill_events.py — 로컬
          #     seeded_postgres_data override + 체이닝된 seeded_broker_order
          #   - tests/repositories/test_postgres_broker_orders.py — 로컬
          #     seeded_postgres_data override + 체이닝된 seeded_order_request
          #   - tests/repositories/test_external_events.py — 로컬 fixture
          #     없이 conftest.py 공용 postgres_repos만 직접 소비(대조군 —
          #     "conftest.py만 고치면 충분한가"를 별도로 확인)
          # migration은 이 CI 전용 컨테이너에만 적용된다(postgres_repos
          # fixture가 create_pool()+run_all_migrations()를 호출).
          # set -e를 쓰지 않는다 — 한 파일이 실패해도 나머지 파일까지 전부
          # 실행해 재현 증거를 한 번의 job 실행에서 모두 모은다.
          overall_status=0
          for f in \
            tests/repositories/test_postgres_fill_events.py \
            tests/repositories/test_postgres_broker_orders.py \
            tests/repositories/test_external_events.py \
          ; do
            echo "::group::test-file $f"
            log_file="/tmp/pg_fixture_$(basename "$f" .py).log"
            bash scripts/harness/run.sh test-file "$f" 2>&1 | tee "$log_file"
            status="${PIPESTATUS[0]}"

            skipped_line="$(grep -oE '[0-9]+ skipped' "$log_file" | tail -1 || true)"
            skipped_count="$(printf '%s' "$skipped_line" | grep -oE '^[0-9]+' || true)"
            skipped_count="${skipped_count:-0}"
            summary_line="$(grep -E '^[0-9]+ (passed|failed|error)' "$log_file" | tail -1 || true)"

            echo "file=$f exit_status=$status skipped_count=$skipped_count summary=$summary_line"

            if [ "$status" != "0" ]; then
              overall_status=1
            fi
            if [ "$skipped_count" != "0" ]; then
              echo "::error::$f — PostgreSQL 통합 테스트가 ${skipped_count}건 skip됐습니다."
              overall_status=1
            fi
            echo "::endgroup::"
          done

          if [ "$overall_status" != "0" ]; then
            echo "::error::PostgreSQL fixture loop-scope 통합 테스트 중 하나 이상 실패/skip됐습니다 — 위 그룹별 요약을 확인하세요."
          fi
          exit "$overall_status"

      - name: Stop CI-only ephemeral PostgreSQL container
        if: always()
        run: docker rm -f trading_db_pg_fixture_ci >/dev/null 2>&1 || true

  market_hours_guard:
    name: Market-hours deploy guard
    runs-on: ubuntu-latest
    needs: [safe, changes]
    if: needs.safe.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy_required == '1') || (github.event_name == 'workflow_dispatch' && inputs.deploy_main == 'true'))
    outputs:
      allow_deploy: ${{ steps.guard.outputs.allow_deploy }}
      deploy_skipped_by_market_hours_count: ${{ steps.guard.outputs.deploy_skipped_by_market_hours_count }}
      deploy_market_hours_override_count: ${{ steps.guard.outputs.deploy_market_hours_override_count }}
      deploy_market_hours_frontend_only_pass_count: ${{ steps.guard.outputs.deploy_market_hours_frontend_only_pass_count }}
    steps:
      - name: Evaluate KST market-hours guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          hour_min_kst="$(TZ=Asia/Seoul date +%H%M)"
          weekday_kst="$(TZ=Asia/Seoul date +%u)"
          timestamp_kst="$(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M:%S%z)"

          in_market_hours="0"
          if [ "$weekday_kst" -ge 1 ] && [ "$weekday_kst" -le 5 ] && [ "$hour_min_kst" -ge 0900 ] && [ "$hour_min_kst" -lt 1530 ]; then
            in_market_hours="1"
          fi

          allow_deploy="1"
          deploy_skipped_by_market_hours_count="0"
          deploy_market_hours_override_count="0"

          deploy_market_hours_frontend_only_pass_count="0"

          if [ "$in_market_hours" = "1" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_market_hours_deploy }}" = "true" ]; then
              deploy_market_hours_override_count="1"
            elif [ "${{ needs.changes.outputs.frontend_only_activate }}" = "1" ]; then
              # 프런트 전용 변경은 ops-scheduler, reconciliation-worker, api를 건드리지
              # 않는다. admin_ui/는 어떤 컨테이너에도 bind mount되지 않고 build context로만
              # 쓰이며, Admin UI는 read/inspect 전용이라 매매 개입 수단을 노출하지 않는다.
              # 장중 차단을 유지하면 override 사용이 습관이 되어 가드 자체가 무력해진다.
              deploy_market_hours_frontend_only_pass_count="1"
            else
              allow_deploy="0"
              deploy_skipped_by_market_hours_count="1"
            fi
          fi

          {
            echo "allow_deploy=$allow_deploy"
            echo "deploy_skipped_by_market_hours_count=$deploy_skipped_by_market_hours_count"
            echo "deploy_market_hours_override_count=$deploy_market_hours_override_count"
            echo "deploy_market_hours_frontend_only_pass_count=$deploy_market_hours_frontend_only_pass_count"
          } >> "$GITHUB_OUTPUT"

          echo "market_guard_kst_timestamp=$timestamp_kst"
          echo "market_guard_weekday_kst=$weekday_kst"
          echo "market_guard_hour_min_kst=$hour_min_kst"
          echo "market_guard_in_market_hours=$in_market_hours"
          echo "deploy_skipped_by_market_hours_count=$deploy_skipped_by_market_hours_count"
          echo "deploy_market_hours_override_count=$deploy_market_hours_override_count"
          echo "deploy_market_hours_frontend_only_pass_count=$deploy_market_hours_frontend_only_pass_count"

  sync_source:
    name: Sync source after safe harness
    runs-on: ubuntu-latest
    needs: [safe, changes, market_hours_guard]
    if: >-
      always() &&
      needs.safe.result == 'success' &&
      needs.changes.result == 'success' && (
        (
          needs.market_hours_guard.result == 'success' &&
          needs.market_hours_guard.outputs.allow_deploy == '1'
        ) || (
          needs.market_hours_guard.result == 'skipped' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.activate_required == '0' &&
          needs.changes.outputs.sync_only_allowlist_count != '0' &&
          needs.changes.outputs.sync_only_blocked_count == '0'
        )
      )
    steps:
      - name: Sync source on Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          script: |
            set -euo pipefail

            cd /workspace/agent_trading

            git fetch origin main
            deploy_target_sha="$(git rev-parse origin/main)"
            server_head_sha="$(git rev-parse HEAD)"

            # sync-only 모드(장중 등 allow_deploy!=1)에서는 activate_runtime이 실행되지
            # 않는다. 그런데 git reset --hard는 이번 push의 변경분이 아니라 origin/main
            # 트리 전체를 내려받으므로, 앞서 장중에 차단된 runtime 변경이 함께 묻어
            # 들어올 수 있다. src/와 scripts/는 ops-scheduler에 bind mount돼 있고
            # decision loop는 매 사이클 subprocess로 새로 spawn되므로, 그렇게 들어온
            # 코드는 컨테이너 재기동 없이 장중에 그대로 적용된다.
            # 이 경우 동기화를 진행하지 않고 실패로 남긴다.
            # 판정 기준은 "allow_deploy가 0인가"가 아니라 "activate_runtime이 전체
            # 재기동을 하는가"다. 프런트 전용 배포는 allow_deploy=1이지만 frontend만
            # 재빌드하므로, 함께 내려온 백엔드 변경이 bind mount된 src/·scripts/에
            # 남아 다음 decision loop subprocess에서 재기동 없이 적용된다.
            deploy_sync_pending_runtime_file_count=0
            pending_runtime_files=""
            if [ "${{ needs.market_hours_guard.outputs.allow_deploy }}" != "1" ] \
              || [ "${{ needs.changes.outputs.frontend_only_activate }}" = "1" ]; then
              pending_runtime_files="$(
                git diff --name-only "$server_head_sha" "$deploy_target_sha" |
                  sed '/^$/d' |
                  grep -E '${{ needs.changes.outputs.runtime_affecting_pattern }}' || true
              )"
              if [ "${{ needs.changes.outputs.frontend_only_activate }}" = "1" ]; then
                # 프런트 전용 경로에서는 admin_ui/ 변경이 frontend 재빌드로 실제 반영되므로
                # 대기 변경으로 보지 않는다. 그 밖의 runtime 파일만 위험 대상이다.
                pending_runtime_files="$(printf '%s\n' "$pending_runtime_files" | sed '/^$/d' | grep -vE '^admin_ui/' || true)"
              fi
              deploy_sync_pending_runtime_file_count="$(printf '%s\n' "$pending_runtime_files" | sed '/^$/d' | wc -l | tr -d ' ')"
            fi
            echo "deploy_sync_pending_runtime_file_count=$deploy_sync_pending_runtime_file_count"

            if [ "$deploy_sync_pending_runtime_file_count" -gt 0 ]; then
              echo "deploy_sync_blocked_by_pending_runtime_count=1"
              echo "server_head_sha=$server_head_sha"
              echo "deploy_target_sha=$deploy_target_sha"
              echo "DETAIL pending_runtime_files:"
              printf '%s\n' "$pending_runtime_files" | sed '/^$/d' | sed 's/^/- /'
              echo "DETAIL recovery:"
              echo "- 이 실패는 sync-only 배포가 재기동 없이 런타임 코드를 서버에 내려놓는 것을 막은 결과다. 서버 상태는 바뀌지 않았다."
              echo "- 해소 전까지 뒤따르는 문서/하네스 머지도 같은 지점에서 계속 실패한다."
              echo "- 해소 방법 1: 장 종료(15:30 KST) 후 배포성 변경을 push하면 전체 배포가 돌며 함께 정리된다."
              echo "- 해소 방법 2: 즉시 정리하려면 Actions에서 Harness workflow를 workflow_dispatch로 실행하고 deploy_main=true를 지정한다."
              echo "- 장중에 즉시 배포해야 하면 allow_market_hours_deploy=true를 함께 지정한다. 운영 재기동이 발생하므로 매매 영향을 먼저 판단한다."
              exit 1
            fi
            echo "deploy_sync_blocked_by_pending_runtime_count=0"

            git reset --hard "$deploy_target_sha"

            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_main }}" = "true" ]; then
              echo "deploy_manual_dispatch_count=1"
            else
              echo "deploy_manual_dispatch_count=0"
            fi

            if [ "${{ needs.market_hours_guard.outputs.allow_deploy }}" = "1" ]; then
              echo "deploy_sync_only_run_count=0"
              echo "deploy_activate_skipped_by_market_hours_count=0"
            else
              echo "deploy_sync_only_run_count=1"
              echo "deploy_activate_skipped_by_market_hours_count=1"
            fi

            echo "deploy_market_hours_override_count=${{ needs.market_hours_guard.outputs.deploy_market_hours_override_count }}"
            echo "deploy_target_sha=$deploy_target_sha"
            echo "deploy_sync_run_count=1"

  activate_runtime:
    name: Activate runtime after source sync
    runs-on: ubuntu-latest
    needs: [safe, changes, market_hours_guard, sync_source]
    if: >-
      needs.safe.result == 'success' &&
      needs.sync_source.result == 'success' &&
      needs.market_hours_guard.outputs.allow_deploy == '1' && (
        (github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.activate_required == '1') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_main == 'true')
      )
    steps:
      - name: Activate runtime on Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          script: |
            set -euo pipefail

            cd /workspace/agent_trading

            if [ "${{ needs.changes.outputs.frontend_only_activate }}" = "1" ]; then
              # 프런트 전용 변경: frontend 이미지만 재빌드한다. DB 스키마 변경이
              # 있을 수 없으므로 migrate를 돌리지 않고, 단일 서비스 지정에
              # --remove-orphans를 함께 쓰면 나머지 서비스가 orphan으로 판정될 수
              # 있으므로 쓰지 않는다.
              bash scripts/harness/docker_compose_env.sh up -d --build frontend
              echo "deploy_migration_run=0"
              echo "deploy_frontend_only_activate_count=1"
            else
              bash scripts/harness/docker_compose_env.sh run --build --rm migrate
              echo "deploy_migration_run=1"

              bash scripts/harness/docker_compose_env.sh up -d --build --remove-orphans
              echo "deploy_frontend_only_activate_count=0"
            fi
            echo "deploy_restart_run=1"

            # nginx-proxy의 proxy_pass가 리터럴 호스트명을 쓰고 resolver가 없어
            # 기동 시 1회만 DNS를 해석한다. frontend를 recreate하면 IP가 바뀌므로
            # reload가 없으면 502가 난다. 두 분기 모두에서 생략하지 않는다.
            docker exec nginx-proxy nginx -s reload
            echo "deploy_proxy_reload_run=1"
            echo "deploy_activate_run_count=1"

            bash scripts/harness/docker_compose_env.sh ps

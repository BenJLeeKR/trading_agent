name: Harness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_main:
        description: "Deploy latest origin/main after safe harness"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      allow_market_hours_deploy:
        description: "Reserved for market-hours deploy override"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_heavy:
        description: "Run HARNESS_ALLOW_HEAVY gated checks"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Deployment change detector
    runs-on: ubuntu-latest
    outputs:
      deploy_required: ${{ steps.detect.outputs.deploy_required }}
      activate_required: ${{ steps.detect.outputs.activate_required }}
      changed_file_count: ${{ steps.detect.outputs.changed_file_count }}
      deploy_relevant_file_count: ${{ steps.detect.outputs.deploy_relevant_file_count }}
      sync_only_candidate_count: ${{ steps.detect.outputs.sync_only_candidate_count }}
      sync_only_allowlist_count: ${{ steps.detect.outputs.sync_only_allowlist_count }}
      sync_only_blocked_count: ${{ steps.detect.outputs.sync_only_blocked_count }}
      deploy_manual_dispatch_requested_count: ${{ steps.detect.outputs.deploy_manual_dispatch_requested_count }}
      frontend_only_activate: ${{ steps.detect.outputs.frontend_only_activate }}
      non_frontend_runtime_file_count: ${{ steps.detect.outputs.non_frontend_runtime_file_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect deploy-relevant changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            deploy_manual_dispatch_requested_count="0"
            if [ "${{ inputs.deploy_main }}" = "true" ]; then
              deploy_manual_dispatch_requested_count="1"
            fi

            {
              echo "deploy_required=0"
              echo "activate_required=0"
              echo "changed_file_count=0"
              echo "deploy_relevant_file_count=0"
              echo "sync_only_candidate_count=0"
              echo "sync_only_allowlist_count=0"
              echo "sync_only_blocked_count=0"
              echo "deploy_manual_dispatch_requested_count=$deploy_manual_dispatch_requested_count"
              echo "frontend_only_activate=0"
              echo "non_frontend_runtime_file_count=0"
            } >> "$GITHUB_OUTPUT"

            echo "changed_file_count=0"
            echo "deploy_relevant_file_count=0"
            echo "deploy_required=0"
            echo "activate_required=0"
            echo "sync_only_candidate_count=0"
            echo "sync_only_allowlist_count=0"
            echo "sync_only_blocked_count=0"
            echo "deploy_skipped_by_docs_only_count=0"
            echo "deploy_manual_dispatch_requested_count=$deploy_manual_dispatch_requested_count"
            echo "frontend_only_activate_count=0"
            echo "non_frontend_runtime_file_count=0"
            exit 0
          fi

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            base_ref="${{ github.event.before }}"
          fi

          changed_files="$(git diff --name-only "$base_ref" HEAD || true)"
          changed_file_count="$(printf '%s\n' "$changed_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          sync_only_allowlist_pattern='^(docs/.+|scripts/(analyze_trigger_proxy_attribution\.py|check_index_membership_staleness\.py|check_t3_db_status\.py|diagnose_activity_filter_half_period_divergence\.py|diagnose_blocked_reason_distribution\.py|diagnose_market_overlay_shadow\.py|observe_seeded_news_comparison\.py))$'
          runtime_affecting_pattern='^(\.github/workflows/|\.python-version|\.postgres-version|Dockerfile|docker-compose\.yml|pyproject\.toml|requirements(\.lock|\.txt)?|db/|src/|admin_ui/(Dockerfile|nginx\.frontend\.conf|package(-lock)?\.json|tsconfig[^/]*\.json|vite\.config\.[^/]+|src/|public/))'
          sync_only_candidates="$(
            printf '%s\n' "$changed_files" |
              sed '/^$/d' |
              grep -E '^(docs/.+|scripts/[^/]+\.(py|sh))$' || true
          )"
          sync_only_allowlist_files="$(
            printf '%s\n' "$sync_only_candidates" |
              sed '/^$/d' |
              grep -E "$sync_only_allowlist_pattern" || true
          )"
          runtime_affecting_files="$(
            printf '%s\n' "$changed_files" |
              sed '/^$/d' |
              grep -E "$runtime_affecting_pattern" || true
          )"
          deploy_relevant_files="$(
            printf '%s\n' "$changed_files" |
              sed '/^$/d' |
              grep -E '^(\.python-version|\.postgres-version|Dockerfile|docker-compose\.yml|pyproject\.toml|requirements(\.lock|\.txt)?|db/|src/|scripts/[^/]+\.(py|sh)|admin_ui/(Dockerfile|nginx\.frontend\.conf|package(-lock)?\.json|tsconfig[^/]*\.json|vite\.config\.[^/]+|src/|public/))' || true
          )"
          sync_only_candidate_count="$(printf '%s\n' "$sync_only_candidates" | sed '/^$/d' | wc -l | tr -d ' ')"
          sync_only_allowlist_count="$(printf '%s\n' "$sync_only_allowlist_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          sync_only_blocked_count="$((sync_only_candidate_count - sync_only_allowlist_count))"
          deploy_relevant_file_count="$(printf '%s\n' "$deploy_relevant_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          activate_relevant_file_count="$(printf '%s\n' "$runtime_affecting_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          # 런타임 영향 파일이 전부 admin_ui/ 아래면 프런트 전용 배포로 본다.
          # admin_ui/AGENTS.md 같은 비런타임 파일은 애초에 runtime_affecting_pattern에
          # 걸리지 않으므로 여기서 따로 걸러낼 필요가 없다.
          non_frontend_runtime_files="$(
            printf '%s\n' "$runtime_affecting_files" |
              sed '/^$/d' |
              grep -vE '^admin_ui/' || true
          )"
          non_frontend_runtime_file_count="$(printf '%s\n' "$non_frontend_runtime_files" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$deploy_relevant_file_count" -gt 0 ]; then
            deploy_required="1"
            deploy_skipped_by_docs_only_count="0"
          else
            deploy_required="0"
            deploy_skipped_by_docs_only_count="1"
          fi

          if [ "$activate_relevant_file_count" -gt 0 ]; then
            activate_required="1"
          else
            activate_required="0"
          fi

          if [ "$activate_required" = "1" ] && [ "$non_frontend_runtime_file_count" -eq 0 ]; then
            frontend_only_activate="1"
          else
            frontend_only_activate="0"
          fi

          {
            echo "deploy_required=$deploy_required"
            echo "activate_required=$activate_required"
            echo "changed_file_count=$changed_file_count"
            echo "deploy_relevant_file_count=$deploy_relevant_file_count"
            echo "sync_only_candidate_count=$sync_only_candidate_count"
            echo "sync_only_allowlist_count=$sync_only_allowlist_count"
            echo "sync_only_blocked_count=$sync_only_blocked_count"
            echo "deploy_manual_dispatch_requested_count=0"
            echo "frontend_only_activate=$frontend_only_activate"
            echo "non_frontend_runtime_file_count=$non_frontend_runtime_file_count"
          } >> "$GITHUB_OUTPUT"

          echo "changed_file_count=$changed_file_count"
          echo "deploy_relevant_file_count=$deploy_relevant_file_count"
          echo "deploy_required=$deploy_required"
          echo "activate_required=$activate_required"
          echo "sync_only_candidate_count=$sync_only_candidate_count"
          echo "sync_only_allowlist_count=$sync_only_allowlist_count"
          echo "sync_only_blocked_count=$sync_only_blocked_count"
          echo "deploy_skipped_by_docs_only_count=$deploy_skipped_by_docs_only_count"
          echo "deploy_manual_dispatch_requested_count=0"
          echo "frontend_only_activate_count=$frontend_only_activate"
          echo "non_frontend_runtime_file_count=$non_frontend_runtime_file_count"

  safe:
    name: Safe harness contracts
    runs-on: ubuntu-latest
    env:
      HARNESS_CI: "1"
      HARNESS_SAFE_TIMEOUT_SECONDS: "180"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: admin_ui/.nvmrc
          cache: npm
          cache-dependency-path: admin_ui/package-lock.json

      - name: Install backend dependencies
        run: python3 -m pip install --constraint requirements.lock -e ".[dev]"

      - name: Install Admin UI dependencies
        working-directory: admin_ui
        run: npm ci

      - name: Start pinned PostgreSQL container
        run: |
          POSTGRES_VERSION="$(cat .postgres-version)"
          docker run --detach --name trading_db \
            --env POSTGRES_USER=trading \
            --env POSTGRES_PASSWORD=trading \
            --env POSTGRES_DB=trading \
            "postgres:${POSTGRES_VERSION}"
          for attempt in {1..30}; do
            if docker exec trading_db pg_isready -U trading -d trading >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs trading_db
          exit 1

      - name: Run quick harness snapshot
        run: bash scripts/harness/run.sh check quick

      - name: Run architecture and style contracts
        run: |
          bash scripts/harness/run.sh accept db-structure
          bash scripts/harness/run.sh accept architecture
          bash scripts/harness/run.sh accept style
          bash scripts/harness/run.sh accept no-bypass

      - name: Run type-check contracts
        run: |
          bash scripts/harness/run.sh type-check backend
          bash scripts/harness/run.sh type-check frontend

      - name: Run read-only security snapshot
        run: bash scripts/harness/run.sh security scan

  heavy:
    name: Heavy harness contracts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_heavy == 'true'
    env:
      HARNESS_CI: "1"
      HARNESS_ALLOW_HEAVY: "1"
      HARNESS_HEAVY_TIMEOUT_SECONDS: "900"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: admin_ui/.nvmrc
          cache: npm
          cache-dependency-path: admin_ui/package-lock.json

      - name: Install backend dependencies
        run: python3 -m pip install --constraint requirements.lock -e ".[dev]"

      - name: Install Admin UI dependencies
        working-directory: admin_ui
        run: npm ci

      - name: Run heavy harness checks
        run: |
          bash scripts/harness/run.sh full-test
          bash scripts/harness/run.sh admin-build

  market_hours_guard:
    name: Market-hours deploy guard
    runs-on: ubuntu-latest
    needs: [safe, changes]
    if: needs.safe.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy_required == '1') || (github.event_name == 'workflow_dispatch' && inputs.deploy_main == 'true'))
    outputs:
      allow_deploy: ${{ steps.guard.outputs.allow_deploy }}
      deploy_skipped_by_market_hours_count: ${{ steps.guard.outputs.deploy_skipped_by_market_hours_count }}
      deploy_market_hours_override_count: ${{ steps.guard.outputs.deploy_market_hours_override_count }}
    steps:
      - name: Evaluate KST market-hours guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          hour_min_kst="$(TZ=Asia/Seoul date +%H%M)"
          weekday_kst="$(TZ=Asia/Seoul date +%u)"
          timestamp_kst="$(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M:%S%z)"

          in_market_hours="0"
          if [ "$weekday_kst" -ge 1 ] && [ "$weekday_kst" -le 5 ] && [ "$hour_min_kst" -ge 0900 ] && [ "$hour_min_kst" -lt 1530 ]; then
            in_market_hours="1"
          fi

          allow_deploy="1"
          deploy_skipped_by_market_hours_count="0"
          deploy_market_hours_override_count="0"

          if [ "$in_market_hours" = "1" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_market_hours_deploy }}" = "true" ]; then
              deploy_market_hours_override_count="1"
            else
              allow_deploy="0"
              deploy_skipped_by_market_hours_count="1"
            fi
          fi

          {
            echo "allow_deploy=$allow_deploy"
            echo "deploy_skipped_by_market_hours_count=$deploy_skipped_by_market_hours_count"
            echo "deploy_market_hours_override_count=$deploy_market_hours_override_count"
          } >> "$GITHUB_OUTPUT"

          echo "market_guard_kst_timestamp=$timestamp_kst"
          echo "market_guard_weekday_kst=$weekday_kst"
          echo "market_guard_hour_min_kst=$hour_min_kst"
          echo "market_guard_in_market_hours=$in_market_hours"
          echo "deploy_skipped_by_market_hours_count=$deploy_skipped_by_market_hours_count"
          echo "deploy_market_hours_override_count=$deploy_market_hours_override_count"

  sync_source:
    name: Sync source after safe harness
    runs-on: ubuntu-latest
    needs: [safe, changes, market_hours_guard]
    if: >-
      always() &&
      needs.safe.result == 'success' &&
      needs.changes.result == 'success' && (
        (
          needs.market_hours_guard.result == 'success' &&
          needs.market_hours_guard.outputs.allow_deploy == '1'
        ) || (
          needs.market_hours_guard.result == 'skipped' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.activate_required == '0' &&
          needs.changes.outputs.sync_only_allowlist_count != '0' &&
          needs.changes.outputs.sync_only_blocked_count == '0'
        )
      )
    steps:
      - name: Sync source on Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          script: |
            set -euo pipefail

            cd /workspace/agent_trading

            git fetch origin main
            deploy_target_sha="$(git rev-parse origin/main)"
            git reset --hard "$deploy_target_sha"

            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_main }}" = "true" ]; then
              echo "deploy_manual_dispatch_count=1"
            else
              echo "deploy_manual_dispatch_count=0"
            fi

            if [ "${{ needs.market_hours_guard.outputs.allow_deploy }}" = "1" ]; then
              echo "deploy_sync_only_run_count=0"
              echo "deploy_activate_skipped_by_market_hours_count=0"
            else
              echo "deploy_sync_only_run_count=1"
              echo "deploy_activate_skipped_by_market_hours_count=1"
            fi

            echo "deploy_market_hours_override_count=${{ needs.market_hours_guard.outputs.deploy_market_hours_override_count }}"
            echo "deploy_target_sha=$deploy_target_sha"
            echo "deploy_sync_run_count=1"

  activate_runtime:
    name: Activate runtime after source sync
    runs-on: ubuntu-latest
    needs: [safe, changes, market_hours_guard, sync_source]
    if: >-
      needs.safe.result == 'success' &&
      needs.sync_source.result == 'success' &&
      needs.market_hours_guard.outputs.allow_deploy == '1' && (
        (github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.activate_required == '1') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_main == 'true')
      )
    steps:
      - name: Activate runtime on Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          script: |
            set -euo pipefail

            cd /workspace/agent_trading

            if [ "${{ needs.changes.outputs.frontend_only_activate }}" = "1" ]; then
              # 프런트 전용 변경: frontend 이미지만 재빌드한다. DB 스키마 변경이
              # 있을 수 없으므로 migrate를 돌리지 않고, 단일 서비스 지정에
              # --remove-orphans를 함께 쓰면 나머지 서비스가 orphan으로 판정될 수
              # 있으므로 쓰지 않는다.
              bash scripts/harness/docker_compose_env.sh up -d --build frontend
              echo "deploy_migration_run=0"
              echo "deploy_frontend_only_activate_count=1"
            else
              bash scripts/harness/docker_compose_env.sh run --build --rm migrate
              echo "deploy_migration_run=1"

              bash scripts/harness/docker_compose_env.sh up -d --build --remove-orphans
              echo "deploy_frontend_only_activate_count=0"
            fi
            echo "deploy_restart_run=1"

            # nginx-proxy의 proxy_pass가 리터럴 호스트명을 쓰고 resolver가 없어
            # 기동 시 1회만 DNS를 해석한다. frontend를 recreate하면 IP가 바뀌므로
            # reload가 없으면 502가 난다. 두 분기 모두에서 생략하지 않는다.
            docker exec nginx-proxy nginx -s reload
            echo "deploy_proxy_reload_run=1"
            echo "deploy_activate_run_count=1"

            bash scripts/harness/docker_compose_env.sh ps
